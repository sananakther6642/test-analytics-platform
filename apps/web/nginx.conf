# Serves the static frontend and reverse-proxies /api to the backend
# container. In docker-compose, "api" resolves via Docker's embedded DNS
# to the api service; in Kubernetes (Phase 6), the same name resolves via
# the cluster Service — the app never needs to know which.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
