# Serves the static frontend and reverse-proxies /api to the backend
# container. The upstream host and scheme are templated via envsubst (see
# Dockerfile) because they differ per platform: docker-compose resolves
# the literal name "api" over plain HTTP via its embedded DNS; Kubernetes
# resolves a Service name the same way; but Azure Container Apps' internal
# ingress terminates TLS even for internal traffic (allowInsecure: false)
# and its FQDN embeds a randomly-generated environment suffix, so neither
# the scheme nor the host can be hardcoded into the image.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass ${API_UPSTREAM_SCHEME}://${API_UPSTREAM_HOST}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Connection "";
        proxy_set_header Host ${API_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
